services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgresql://app:password@db:5432/app_db
      AUTH_SECRET: dev-only-secret-change-me-0123456789abcdef
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      LOG_LEVEL: info
      LOG_PRETTY: "true"
      # Windows の Docker Desktop はバインドマウント上のファイル変更を
      # inotify で検知できないため、ポーリング監視に切り替える
      # （Turbopack はこの環境ではポーリング設定でもファイル変更を検知できなかったため、
      #   実績のある webpack + WATCHPACK_POLLING の組み合わせを使う）
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    # 起動のたびに Prisma Client を最新化 → マイグレーション適用 → dev サーバ起動
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && pnpm exec next dev --webpack"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgresql://app:password@db:5432/app_db
      LOG_LEVEL: info
      LOG_PRETTY: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ..:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    # tsx watch でソース変更のたびに worker を自動再起動する（開発用）
    # 接続情報は上の environment が渡すため .env は不要。--env-file-if-exists にして
    # .env 未作成のクローン直後でも起動できるようにする（.env があればそちらも読む）
    command: sh -c "pnpm prisma generate && pnpm exec tsx watch --env-file-if-exists=.env src/worker/index.ts"

volumes:
  db-data:
