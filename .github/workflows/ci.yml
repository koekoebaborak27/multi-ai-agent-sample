name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://app:password@localhost:5432/app_db
  AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma validate
        run: pnpm exec prisma validate

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Apply migrations（0からスキーマを再現できることの検証）
        run: pnpm exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
